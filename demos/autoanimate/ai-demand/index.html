<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../player/ddfe58a03a/">
<meta name="autoanimate-film" content="../../films/ai-demand.film">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<!-- Added to the Home Screen, the page opens with no browser bars: the only
     way to a full screen on iPhone Safari, which has no element fullscreen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI demand</title>
<style>
  :root {
    --left: env(safe-area-inset-left, 0px);
    --right: env(safe-area-inset-right, 0px);
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
    --ink: #e6e8ec;
    --dim: #9aa0aa;
    --accent: #e8b25c;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

  /* Portrait: the film across the full width, the controls beneath it. */
  #player { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
    background: #000; box-sizing: border-box; padding: var(--top) 0 var(--bottom); }
  #stage-box { position: relative; width: 100%; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px;
    padding: 4px max(10px, var(--left)) 8px max(10px, var(--right)); }
  #scrub { order: -1; flex: 0 0 100%; }
  #clock { flex: 1; padding-left: 6px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  button { all: unset; box-sizing: border-box; min-width: 48px; height: 48px; display: inline-grid;
    place-items: center; border-radius: 10px; color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  button:active:not(:disabled) { background: rgb(255 255 255 / 0.14); }
  @media (hover: hover) { button:hover:not(:disabled) { background: rgb(255 255 255 / 0.1); } }
  button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  button svg text { fill: currentColor; stroke: none; font: 700 8px system-ui, sans-serif; text-anchor: middle; }
  #play svg { width: 30px; height: 30px; fill: currentColor; stroke-width: 1.5; }
  #play .pause, #player.playing #play .play { display: none; }
  #player.playing #play .pause { display: block; }
  #speed { min-width: 60px; padding: 0 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #fullscreen[hidden] { display: none; }

  /* The scrub bar: a thin track inside a finger-sized hit area. */
  #scrub { -webkit-appearance: none; appearance: none; height: 36px; margin: 0; background: transparent;
    cursor: pointer; touch-action: none; }
  #scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--played, 0%), rgb(255 255 255 / 0.28) var(--played, 0%)); }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px;
    border-radius: 50%; background: var(--accent); }
  #scrub::-moz-range-track { height: 4px; border-radius: 2px; background: rgb(255 255 255 / 0.28); }
  #scrub::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  #scrub::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent); }

  #message { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%;
    padding: 8px 14px; border-radius: 10px; background: rgb(0 0 0 / 0.72); color: var(--accent);
    text-align: center; white-space: pre-wrap; pointer-events: none; }
  #message:empty { display: none; }
  #readout { position: absolute; left: 6px; top: 4px; font: 10px/1.2 ui-monospace, Menlo, monospace;
    color: rgb(255 255 255 / 0.5); pointer-events: none; white-space: pre; }
  #readout:empty { display: none; }

  /* The transcript strip: the line being said, from the film's captions.vtt.
     Absent when the film has none. Portrait: under the picture, two lines
     high so the picture does not move as lines change. */
  #subtitle { box-sizing: border-box; min-height: calc(2.7em + 6px); padding: 4px max(12px, var(--left)) 2px max(12px, var(--right));
    color: var(--ink); font-size: 13px; line-height: 1.35; text-align: center; text-wrap: balance;
    pointer-events: none; }
  #subtitle[hidden] { display: none; }

  /* Landscape (a phone on its side, a desktop window, fullscreen): the film
     fills the screen, letterboxed, and the controls lie over its bottom edge.
     They fade while it plays and come back on a tap or a mouse move. */
  @media (orientation: landscape) {
    #player { padding: var(--top) var(--right) var(--bottom) var(--left); align-items: center; }
    #stage-box { width: min(100vw - var(--left) - var(--right), (100vh - var(--top) - var(--bottom)) * 16 / 9); }
    @supports (height: 100dvh) {
      #stage-box { width: min(100vw - var(--left) - var(--right), (100dvh - var(--top) - var(--bottom)) * 16 / 9); }
    }
    #controls { position: absolute; left: 0; right: 0; bottom: 0; flex-wrap: nowrap; gap: 4px;
      padding: 28px max(12px, var(--left)) max(6px, var(--bottom)) max(12px, var(--right));
      background: linear-gradient(to top, rgb(0 0 0 / 0.82), rgb(0 0 0 / 0.5) 55%, transparent);
      transition: opacity 0.25s; }
    #scrub { order: 0; flex: 1 1 auto; min-width: 60px; height: 48px; }
    #clock { flex: 0 0 auto; padding: 0 6px; }
    /* Over the bottom of the picture, above the controls; lower once they fade. */
    #subtitle { position: absolute; left: 0; right: 0; bottom: calc(max(6px, var(--bottom)) + 80px); min-height: 0;
      padding: 0 max(16px, var(--left)) 0 max(16px, var(--right)); font-size: clamp(13px, 1.7vw, 22px);
      transition: bottom 0.25s; }
    #subtitle span { padding: 2px 8px; border-radius: 6px; background: rgb(0 0 0 / 0.62);
      -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    #player.idle #subtitle { bottom: max(10px, var(--bottom)); }
    #subtitle span:empty { display: none; }
    #player.idle { cursor: none; }
    #player.idle #controls { opacity: 0; pointer-events: none; }
  }
</style>
</head>
<body>
<div id="player">
  <div id="stage-box">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="readout"></div>
    <div id="message">loading…</div>
  </div>
  <div id="subtitle" hidden><span></span></div>
  <div id="controls">
    <button id="back" type="button" disabled aria-label="Back 10 seconds" title="Back 10 seconds (left arrow)">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="15">10</text></svg>
    </button>
    <button id="play" type="button" disabled aria-label="Play" title="Play or pause (space)">
      <svg class="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button id="forward" type="button" disabled aria-label="Forward 10 seconds" title="Forward 10 seconds (right arrow)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15">10</text></svg>
    </button>
    <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" disabled aria-label="Position">
    <span id="clock">0:00 / 0:00</span>
    <button id="speed" type="button" aria-label="Playback speed" title="Playback speed: tap to go up by 0.25">1×</button>
    <button id="fullscreen" type="button" hidden aria-label="Fullscreen" title="Fullscreen (f)">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</div>
<script type="module" src="./player.js"></script>
</body>
</html>
